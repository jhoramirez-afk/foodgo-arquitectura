name: Desplegar FoodGo en AWS Academy

on:
  push:
    branches: [main]
    # El material de presentación y las validaciones de CI no deben iniciar AWS.
    # Los cambios del propio workflow pueden probarse mediante workflow_dispatch.
    paths:
      - 'infra/**'
      - 'swarm/**'
      - 'functions/**'
      - 'scripts/cloud.py'
      - 'scripts/registry.py'
      - 'scripts/smoke.py'
      - 'scripts/source_matrix.py'
      - 'scripts/requirements-aws.txt'
      - 'docker-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodgo-ep03-learner-lab
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  FOODGO_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  provisionar:
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      bucket: ${{ steps.provision.outputs.bucket }}
      prefix: ${{ steps.provision.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: functions/notificaciones/pom.xml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: python -m pip install -r scripts/requirements-aws.txt
      - name: Validar infraestructura y probar Lambda
        run: |
          cfn-lint --template infra/aws/cluster.yaml infra/aws/mensajeria.yaml --regions "$AWS_REGION"
          mvn -B -ntp -f functions/notificaciones/pom.xml clean verify
          docker stack config --skip-interpolation -c docker-stack.yml > /dev/null
          python -m unittest discover -s scripts/tests -v
      - name: Fijar los commits de los nueve servicios
        id: plan
        run: python scripts/source_matrix.py
      - name: Usar la sesion temporal del Learner Lab
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Provisionar red, Swarm, persistencia, Gateway, SQS y Lambda
        id: provision
        run: python scripts/cloud.py provision

  construir-imagenes:
    needs: provisionar
    if: needs.provisionar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.provisionar.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: infraestructura
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: aplicacion
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar SDK de despliegue
        run: python -m pip install -r infraestructura/scripts/requirements-aws.txt
      - name: Usar la sesion temporal del Learner Lab
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Construir con Maven y publicar la imagen inmutable
        env:
          FOODGO_SERVICE: ${{ matrix.service }}
          FOODGO_SOURCE_SHA: ${{ matrix.sha }}
        run: python infraestructura/scripts/registry.py --service "$FOODGO_SERVICE" --sha "$FOODGO_SOURCE_SHA" --context aplicacion

  desplegar-y-probar:
    needs: [provisionar, construir-imagenes]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar SDK de despliegue
        run: python -m pip install -r scripts/requirements-aws.txt
      - name: Usar la sesion temporal del Learner Lab
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Desplegar el stack versionado en el manager
        env:
          FOODGO_BUCKET: ${{ needs.provisionar.outputs.bucket }}
          FOODGO_PREFIX: ${{ needs.provisionar.outputs.prefix }}
        run: python scripts/cloud.py deploy --bucket "$FOODGO_BUCKET" --prefix "$FOODGO_PREFIX"
      - name: Verificar acceso, ocho dominios, escalado y flujo SQS-Lambda
        run: python scripts/smoke.py --scale --async-flow
      - name: Conservar la evidencia real del despliegue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foodgo-aws-ep03-evidencia
          path: evidencias/aws-ep03.json
          if-no-files-found: warn
          retention-days: 30
