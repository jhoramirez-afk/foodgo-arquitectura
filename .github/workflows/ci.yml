name: Validar FoodGo EP03

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: functions/notificaciones/pom.xml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar herramientas de validacion
        run: python -m pip install -r scripts/requirements-aws.txt
      - name: Compilar y probar Lambda Java 21
        run: mvn -B -ntp -f functions/notificaciones/pom.xml clean verify
      - name: Validar las plantillas CloudFormation
        run: cfn-lint --template infra/aws/cluster.yaml infra/aws/mensajeria.yaml --regions us-east-1
      - name: Validar scripts de despliegue
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s scripts/tests -v
          bash -n swarm/init-postgres.sh
      - name: Validar la definicion Swarm
        run: docker stack config --skip-interpolation -c docker-stack.yml > /dev/null
      - name: Conservar pruebas y JAR
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foodgo-lambda-validacion
          path: |
            functions/notificaciones/target/surefire-reports/
            functions/notificaciones/target/foodgo-notificaciones-lambda-3.0.0.jar
          retention-days: 30
