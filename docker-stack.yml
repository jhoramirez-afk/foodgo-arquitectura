        parallelism: 1
        order: stop-first
        monitor: 180s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    networks:
    - backend
    environment:
      POSTGRES_USER: foodgo_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    secrets:
    - db_password
    - db_root_password
    volumes:
    - postgres_data:/var/lib/postgresql
    configs:
    - source: postgres_init
      target: /docker-entrypoint-initdb.d/01-foodgo.sh
      mode: 365
    command:
    - postgres
    - -c
    - shared_buffers=128MB
    - -c
    - max_connections=64
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U foodgo_admin -d postgres
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    stop_grace_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.labels.foodgo.data == true
      resources:
        limits:
          cpus: '1.0'
          memory: 600M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        order: stop-first
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  ingress:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    networks:
    - backend
    configs:
    - source: nginx
      target: /etc/nginx/conf.d/default.conf
    ports:
    - target: 8080
      published: 80
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      placement:
        preferences:
        - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  backend:
    driver: overlay
    driver_opts:
      encrypted: 'true'
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/foodgo/postgres
secrets:
  db_password:
    external: true
    name: foodgo_ep03_db_password
  db_root_password:
    external: true
    name: foodgo_ep03_db_root_password
configs:
  nginx:
    name: foodgo_ep03_nginx_${CONFIG_VERSION:-v1}
    file: ./swarm/nginx.conf
  postgres_init:
    name: foodgo_ep03_pginit_${CONFIG_VERSION:-v1}
    file: ./swarm/init-postgres.sh
