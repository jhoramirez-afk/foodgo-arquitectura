# FoodGo EP03: desplegar con docker stack deploy, no con docker compose up.
version: '3.8'
services:
  usuarios:
    image: ${IMAGE_USUARIOS}
    environment:
      SPRING_PROFILES_ACTIVE: postgres,eureka,cloud
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: foodgo_usuarios
      DB_USER: foodgo_app
      PORT: '8081'
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: 'true'
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -Dfile.encoding=UTF-8 -Duser.timezone=UTC
    secrets:
    - db_password
    networks:
    - backend
    stop_grace_period: 35s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.75'
          memory: 600M
        reservations:
          cpus: '0.05'
          memory: 300M
      placement:
        preferences:
        - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 180s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  restaurantes:
