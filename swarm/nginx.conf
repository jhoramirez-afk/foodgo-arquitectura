server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    location = /health { access_log off; default_type text/plain; return 200 "FoodGo activo\n"; }
    location /usuarios/ {
        set $backend usuarios:8081;
        rewrite ^/usuarios/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /usuarios;
        proxy_pass http://$backend;
    }
    location /restaurantes/ {
        set $backend restaurantes:8082;
        rewrite ^/restaurantes/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /restaurantes;
        proxy_pass http://$backend;
    }
    location /pedidos/ {
        set $backend pedidos:8083;
        rewrite ^/pedidos/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /pedidos;
        proxy_pass http://$backend;
    }
    location /pagos/ {
        set $backend pagos:8084;
        rewrite ^/pagos/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /pagos;
        proxy_pass http://$backend;
    }
    location /delivery/ {
        set $backend delivery:8085;
        rewrite ^/delivery/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /delivery;
        proxy_pass http://$backend;
    }
    location /notificaciones/ {
        set $backend notificaciones:8086;
        rewrite ^/notificaciones/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /notificaciones;
        proxy_pass http://$backend;
    }
    location /cupones/ {
        set $backend cupones:8087;
        rewrite ^/cupones/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /cupones;
        proxy_pass http://$backend;
    }
    location /resenas/ {
        set $backend resenas:8088;
        rewrite ^/resenas/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /resenas;
        proxy_pass http://$backend;
    }
    location / { return 404; }
}
